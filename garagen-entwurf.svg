<text x="55" y="891" class="small">Übernommen: Garage beim weißen Auto · Werkzeugraum an der Stirnwand · Öllager hinter dem Werkzeugraum.</text>
<text x="55" y="920" class="small">Zugänge nach links versetzt. Eine Stufe hinauf von der Garage in die Werkstatt. Maße des Öllagers noch offen.</text>
<text x="55" y="949" class="dim">Garage ohne seitliche Räume. Erst darüber beginnt die volle Hausgrundfläche. Fenster und Höhen schematisch.</text>
